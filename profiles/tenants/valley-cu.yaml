# Valley Credit Union -- the same vendor product, configured differently.
#
# This is the multi-tenant case the brief describes, and the whole point of the
# overlay: one recording, two institutions, no re-recording. The deltas are
# exactly the three things that actually differ.

schema_version: "1.0"

profile:
  id: valley-cu
  version: "1"
  vendor: meridian
  product: core
  display_name: Valley Credit Union

extends: "meridian-core@4.2"

surface:
  base_url: "http://127.0.0.1:8800/t/valley-cu"

overrides:
  # Known label deltas. These feed the RECORDER, which uses them to emit
  # patterns spanning every tenant's spelling at record time. They do nothing
  # to an artifact that is already recorded -- which is what `locator_overrides`
  # below is for, and what the previous version of this comment got wrong.
  label_overrides:
    "member id": "account holder #"
    "member search": "account holder lookup"

  # Two controls in the recorded `member.lookup_balance` carry only the vendor's
  # spelling, because the real discovery run happened on demo-cu and nothing at
  # record time knew this tenant existed. This is exactly the case the overlay
  # is for: one recording, two institutions, no re-recording.
  #
  # Whole bundles, not patched candidates -- an override is then reviewable as
  # one unit and cannot half-apply.
  locator_overrides:
    "member.lookup_balance:member_search_link":
      target_id: member_search_link
      frame_path: [{name: nav}]
      notes: >-
        Valley calls the screen "Account Holder Lookup". The pattern keeps the
        vendor spelling as an alternate so this bundle stays correct if they
        ever revert to the stock label.
      candidates:
        - strategy: role_name_exact
          role: link
          name: Account Holder Lookup
        - strategy: role_name_pattern
          role: link
          name_pattern: "(?i)^(Account Holder Lookup|Member Search)$"

    "member.lookup_balance:member_id_input":
      target_id: member_id_input
      frame_path: [{name: content}]
      notes: >-
        Same field, their label. Anchor-relative for the same reason the
        recording chose it: this form has no `for` attribute, so the row label
        is the only durable way in.
      candidates:
        - strategy: anchor_relative
          anchor: {text: "Account Holder #"}
          relation: same_row
          target_role: textbox
          occurrence: 0

  # Their premium savings product is the default here.
  param_defaults:
    product_code: SAV2

  # They do not run the vendor's release-notes modal.
  disabled_recoveries: [dismiss_marketing_interstitial]

# ...they run a consent modal instead. New id -> appended to the inherited list.
recoveries:
  - id: valley_terms_interstitial
    description: Acceptable-use consent modal, same obstruction shape as the vendor's.
    trigger:
      element: {role: dialog, name_matches: "(?i)terms of use"}
      exists: true
    actions:
      - type: click
        target:
          target_id: valley_terms_close
          frame_path: [{name: content}]
          notes: Scoped within the dialog, same reasoning as the vendor modal.
          candidates:
            - strategy: role_name_exact
              role: button
              name: Close
              scope:
                anchor: {pattern: "(?i)terms of use"}
                relation: within_dialog
    max_attempts: 1
